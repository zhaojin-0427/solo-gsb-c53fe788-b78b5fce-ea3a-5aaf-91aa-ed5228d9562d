services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dp
      POSTGRES_PASSWORD: dp
      POSTGRES_DB: dpdb
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # First-boot provisioning; the API also applies the idempotent schema
      # at startup, so either path alone is sufficient.
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dp -d dpdb"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://dp:dp@db:5432/dpdb
      SCHEMA_PATH: /srv/sql/001_schema.sql
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
